<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نبض مجرة عالم رقيم — معاينة</title><style>body{margin:0;min-height:100vh;color:#f7e8cd;background:radial-gradient(ellipse at 70% 35%,#263957,#0b1120 58%,#060b14);font-family:Tahoma,Arial,sans-serif}header{padding:30px 7%;display:flex;justify-content:space-between}a{color:#d9b879}main{text-align:center;padding:10vh 20px}h1{font-size:clamp(36px,6vw,80px);color:#e1b86f;font-weight:400}p{line-height:2}article{max-width:680px;margin:60px auto;padding:30px;border:1px solid #8b704d;border-radius:18px;background:#ffffff0a}</style></head><body><header><b>عالم رقيم</b><a href="../">العودة للرئيسية</a></header><main><h1>نبض مجرة عالم رقيم</h1><p>هنا تنبض حكايات عالم رقيم… أحلام تتحول إلى عوالم، وأخبار تستحق أن تُروى.</p><article><h2>الأخبار قيد الإعداد</h2><p>هذه معاينة تصميمية فقط. لن نعرض أخبارًا أو عروضًا غير معتمدة، ولن نربط بيانات الضيوف الحقيقية ببيئة التجربة.</p></article></main></body></html>
